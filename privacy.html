<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow" />
  <title>隐私说明｜AI Signal</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero"><h1>AI Signal 隐私说明</h1></header>
    <section class="list-wrap">
      <p>AI Signal 的公开页面无需注册，不主动收集姓名、邮箱或登录信息。浏览器仅保存筛选和受信任数据源偏好。</p>
      <p>资讯来自公开 RSS、公开网页及明确配置的第三方接口。站点只发布标题、短摘要、来源、时间、公开互动指标与原文链接，不公开 API Key、Cookie、邮箱地址或私有邮件正文。</p>
      <p>启用外部模型时，部分公开文章正文片段可能被发送给已配置的模型服务，用于翻译、标题增强与摘要。部署者应自行核查对应服务的隐私条款。</p>
      <p>如需更正、删除或反馈隐私问题，请通过 <a href="https://github.com/Andrew-liu/ai-signal/issues" rel="noopener noreferrer">GitHub Issues</a> 提交具体 URL 和理由。</p>
      <p><a href="./">返回首页</a> · <a href="./content-policy.html">内容与版权政策</a></p>
    </section>
  </main>
</body>
</html>
